services:
  - type: web
    name: airsense-india
    runtime: python
    region: singapore
    plan: free
    buildCommand: cd Air-Quality-Trends-Analysis-Project-main/frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd Air-Quality-Trends-Analysis-Project-main/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///airq.db
      - key: APP_ENV
        value: production
      - key: AGENT_ENABLED
        value: "true"
      - key: WAQI_TOKEN
        value: 2ea762404c54a8749f1fd5defb8010c540f871ec
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
